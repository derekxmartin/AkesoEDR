version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      compatible-updates:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
